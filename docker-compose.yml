version: '3.8'

services:
  # Alpaca Connection Manager (Stateless gateway)
  connection-manager-alpaca:
    build:
      context: ./connection-manager-alpaca
      dockerfile: Dockerfile
    container_name: connection-manager-alpaca
    ports:
      - "8000:8000"    # FastAPI HTTP REST Port
      - "50051:50051"  # gRPC Service Port
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "8000"
      prometheus.path: "/metrics/"
    volumes:
      # Mount shared proto schema as a read-only volume
      - ./config/grpc-proto-schema:/opt/schemas:ro
    environment:
      - HOST=0.0.0.0
      - PORT_REST=8000
      - PORT_GRPC=50051
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_BASE_URL=https://paper-api.alpaca.markets
      - ALPACA_DATA_FEED=iex
      # Connect to external Kafka via host gateway
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_RAW_ORDER_UPDATES=raw-order-updates
      - KAFKA_AUTO_CREATE_TOPICS=${KAFKA_AUTO_CREATE_TOPICS:-false}
      - TICKERS_TO_TRACK=AAPL,MSFT
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Envoy Layer 7 load balancer proxying Connection Manager services
  tick-lb:
    build:
      context: ./tick-lb
      dockerfile: Dockerfile
    container_name: tick-lb
    ports:
      - "50052:50051"  # Expose Envoy gRPC listener on host port 50052 to avoid conflict with connection-manager
      - "9901:9901"    # Envoy Administration Port
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "9901"
      prometheus.path: "/stats/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - connection-manager-alpaca

  # AAPL Strategy Instance
  signal-gen-aapl:
    build:
      context: ./signal-generator
      dockerfile: Dockerfile
    container_name: signal-gen-aapl
    ports:
      - "8001:8000"    # Expose REST health check on host 8001 (gRPC port 50051 is client-only and not exposed)
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "8000"
      prometheus.path: "/metrics/"
    volumes:
      - ./config/strategies/sma_crossover.py:/app/strategies/sma_crossover.py:ro
    environment:
      - HOST=0.0.0.0
      - PORT_REST=8000
      - PORT_GRPC=50051
      - STRATEGY_FILE_PATH=/app/strategies/sma_crossover.py
      - STRATEGY_CLASS_NAME=SmaCrossoverStrategy
      - 'STRATEGY_PARAMS_JSON={"fast_period": 10, "slow_period": 30}'
      - TICKER=AAPL
      # Connect through Envoy Load Balancer
      - CONNECTION_MANAGER_ENDPOINT=tick-lb:50051
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_SIGNALS=trading-signals
      - KAFKA_AUTO_CREATE_TOPICS=${KAFKA_AUTO_CREATE_TOPICS:-false}
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tick-lb

  # MSFT Strategy Instance
  signal-gen-msft:
    build:
      context: ./signal-generator
      dockerfile: Dockerfile
    container_name: signal-gen-msft
    ports:
      - "8002:8000"    # Expose REST health check on host 8002
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "8000"
      prometheus.path: "/metrics/"
    volumes:
      - ./config/strategies/mean_reversion.py:/app/strategies/mean_reversion.py:ro
    environment:
      - HOST=0.0.0.0
      - PORT_REST=8000
      - PORT_GRPC=50051
      - STRATEGY_FILE_PATH=/app/strategies/mean_reversion.py
      - STRATEGY_CLASS_NAME=MeanReversionStrategy
      - 'STRATEGY_PARAMS_JSON={"period": 20, "threshold": 2.0}'
      - TICKER=MSFT
      # Connect through Envoy Load Balancer
      - CONNECTION_MANAGER_ENDPOINT=tick-lb:50051
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_SIGNALS=trading-signals
      - KAFKA_AUTO_CREATE_TOPICS=${KAFKA_AUTO_CREATE_TOPICS:-false}
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tick-lb

  # Fallback stub container
  signal-gen-default:
    image: alpine:latest
    container_name: signal-gen-default
    command: sleep 3600

  # Order Processing Service (OPS)
  order-processing-service:
    build:
      context: ./CombinedOrderingSystem
      dockerfile: ms/order-processing-service/Dockerfile
    container_name: order-processing-service
    ports:
      - "8081:8081"
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "8081"
      prometheus.path: "/actuator/prometheus"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_SIGNALS=trading-signals
      - KAFKA_TOPIC_ORDER_CREATE=order-create-events
      - PROVIDER_ALPACA_ENDPOINT=connection-manager-alpaca:50051
      - PROVIDER_X_ENDPOINT=connection-manager-x:50051
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tick-lb

  # Order Management Service (OMS)
  order-management-service:
    build:
      context: ./CombinedOrderingSystem
      dockerfile: ms/order-management-service/Dockerfile
    container_name: order-management-service
    ports:
      - "8082:8082"
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "8082"
      prometheus.path: "/actuator/prometheus"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=trading_agent
      - DB_USER=admin
      - DB_PASSWORD=admin
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_ORDER_CREATE=order-create-events
      - KAFKA_TOPIC_RAW_ORDER_UPDATES=raw-order-updates
      - KAFKA_TOPIC_ORDER_COMPLETE=order-complete-events
      - PROVIDER_ALPACA_ENDPOINT=connection-manager-alpaca:50051
      - PROVIDER_X_ENDPOINT=connection-manager-x:50051
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - order-processing-service



  # Quant/UI Dashboard Service
  quant-dashboard:
    build:
      context: ./quant-dashboard
      dockerfile: Dockerfile
    container_name: quant-dashboard
    ports:
      - "8501:8501"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=trading_agent
      - DB_USER=admin
      - DB_PASSWORD=admin
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - STREAMLIT_SERVER_BASE_URL_PATH=dashboard
    networks:
      - default
      - gateway_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Notification Service (Multi-Channel Dispatcher)
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "8085"
      prometheus.path: "/health"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GROUP_ID=notification-service-group
      - TOPIC_ORDER_REJECT=order-reject-events
      - TOPIC_ORDER_CREATE=order-create-events
      - TOPIC_ORDER_COMPLETE=order-complete-events
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://192.168.29.96:3015}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-}
      - EVOLUTION_RECIPIENT=${EVOLUTION_RECIPIENT:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-trading-system-alerts}
    networks:
      - default
      - gateway_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - order-processing-service

  # Prometheus Telemetry Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: root
    ports:
      - "9091:9090"
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana Visualization UI
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_INSTALL_PLUGINS=redis-datasource,hamedkarbasi93-kafka-datasource
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./config/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - default
      - gateway_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # PostgreSQL Prometheus Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://admin:admin@host.docker.internal:5432/trading_agent?sslmode=disable
    ports:
      - "9187:9187"
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "9187"
      prometheus.path: "/metrics"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  # Redis Prometheus Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://host.docker.internal:6379
    ports:
      - "9121:9121"
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "9121"
      prometheus.path: "/metrics"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  # Kafka Prometheus Exporter
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command: --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    labels:
      application: "distributed-trading"
      prometheus.scrape: "true"
      prometheus.port: "9308"
      prometheus.path: "/metrics"
    networks:
      - default

networks:
  default:
    name: kafka_net
    external: true
  gateway_net:
    name: gateway_net
    external: true


