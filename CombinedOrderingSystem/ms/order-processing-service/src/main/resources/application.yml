server:
  port: 8081

spring:
  application:
    name: order-processing-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_SIGNALS:ops-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

trading:
  topics:
    signals: ${KAFKA_TOPIC_SIGNALS:trading-signals}
    order-create: ${KAFKA_TOPIC_ORDER_CREATE:order-create-events}
    order-reject: ${KAFKA_TOPIC_ORDER_REJECT:order-reject-events}
  # Maps registered trading providers to endpoints and market metadata
  providers:
    alpaca:
      endpoint: ${PROVIDER_ALPACA_ENDPOINT:connection-manager-alpaca:50051}
      timezone: ${PROVIDER_ALPACA_TIMEZONE:America/New_York}
      exchange: ${PROVIDER_ALPACA_EXCHANGE:NASDAQ}

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
