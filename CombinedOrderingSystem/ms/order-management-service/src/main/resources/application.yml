server:
  port: 8082

spring:
  application:
    name: order-management-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: oms-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

trading:
  topics:
    order-create: ${KAFKA_TOPIC_ORDER_CREATE:order-create-events}
    raw-updates: ${KAFKA_TOPIC_RAW_ORDER_UPDATES:raw-order-updates}
    order-complete: ${KAFKA_TOPIC_ORDER_COMPLETE:order-complete-events}
  # Maps a provider name to its corresponding gRPC Connection Manager endpoint for reconciliation
  providers:
    alpaca: ${PROVIDER_ALPACA_ENDPOINT:connection-manager-alpaca:50051}
    x: ${PROVIDER_X_ENDPOINT:connection-manager-x:50051}
    default: ${PROVIDER_DEFAULT_ENDPOINT:connection-manager-alpaca:50051}

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
